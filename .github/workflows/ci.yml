name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...
      # Run the installer the way the README does (through iex), against the
      # latest release, and check gitshiny is usable in the same session.
      - name: install.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Get-Content -Raw install.ps1 | iex
          gitshiny version
          if ($LASTEXITCODE -ne 0) { throw "gitshiny version failed" }
          $dir = "$env:LOCALAPPDATA\Programs\gitshiny"
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $dir) { throw "$dir is not on the user Path" }
      # The uninstall commands from the README, checked because they rewrite Path.
      - name: uninstall (README commands)
        shell: powershell
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\gitshiny"
          $others = [Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_ -and $_ -ne $dir }
          Remove-Item -Recurse -Force $dir
          $path = [Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_ -and $_ -ne $dir }
          [Environment]::SetEnvironmentVariable('Path', ($path -join ';'), 'User')
          if (Test-Path $dir) { throw "$dir still exists" }
          $after = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($after -split ';') -contains $dir) { throw "$dir is still on the user Path" }
          if ($after -ne ($others -join ';')) { throw "other Path entries changed: '$after'" }
      - name: install.ps1 (PowerShell 7, custom directory)
        shell: pwsh
        env:
          GITSHINY_INSTALL_DIR: ${{ runner.temp }}\gitshiny-pwsh
        run: |
          Get-Content -Raw install.ps1 | iex
          gitshiny version
          if ($LASTEXITCODE -ne 0) { throw "gitshiny version failed" }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $env:GITSHINY_INSTALL_DIR) { throw "$env:GITSHINY_INSTALL_DIR is not on the user Path" }
